version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${APP_NAME:-0w_sv}
    restart: unless-stopped
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${HOST_PORT:-8002}:8000"
    volumes:
      - ../:/app
      - /app/.venv
    environment: &app-env
      - PYTHONUNBUFFERED=1
      # Internal Docker network addresses and ports
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=jmpt
      - DB_PASSWORD=jmpt
      - DB_NAME=jmpt
      - CACHE_HOST=valkey
      - CACHE_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672

    networks:
      - default

    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${APP_NAME:-0w_sv}_worker
    restart: unless-stopped
    command: uv run taskiq worker utils.broker:broker --reload
    volumes:
      - ../:/app
      - /app/.venv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *app-env
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${APP_NAME:-0w_sv}_scheduler
    restart: unless-stopped
    command: uv run taskiq scheduler utils.scheduler:scheduler tasks.maintenance
    volumes:
      - ../:/app
      - /app/.venv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *app-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      worker:
        condition: service_started

  db:
    image: postgres:17
    container_name: ${APP_NAME:-0w_sv}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jmpt
      POSTGRES_PASSWORD: jmpt
      POSTGRES_DB: jmpt
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        published: "${HOST_DB_PORT:-5433}"
        protocol: tcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmpt"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:latest
    container_name: ${APP_NAME:-0w_sv}_valkey
    restart: unless-stopped
    ports:
      - target: 6379
        host_ip: 127.0.0.1
        published: "${HOST_CACHE_PORT:-6380}"
        protocol: tcp
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      - VALKEY_SECRET_KEY=your_secret_key

  rabbitmq:
    image: rabbitmq:management
    container_name: ${APP_NAME:-0w_sv}_rabbitmq
    restart: unless-stopped
    ports:
      - target: 5672
        host_ip: 127.0.0.1
        published: "${HOST_RABBITMQ_PORT:-5673}"
        protocol: tcp
      - target: 15672
        host_ip: 127.0.0.1
        published: "${HOST_RABBITMQ_MGMT_PORT:-15673}"
        protocol: tcp
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  valkey_data:
  rabbitmq_data:

