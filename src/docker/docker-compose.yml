version: "3.8"

services:
  backend:
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile
    container_name: jmpt_sv
    restart: unless-stopped
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ../../:/app
      - /app/.venv
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment: &app-env
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=jmpt
      - DB_PASSWORD=jmpt
      - DB_NAME=jmpt
      - RABBITMQ_HOST=helios_rabbitmq
      - CACHE_HOST=helios_valkey

    networks:
      - default
      # - shared_net

    # depends_on:
    #   db:
    #     condition: service_healthy
    #   rabbitmq:
    #     condition: service_healthy
    #   valkey:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
