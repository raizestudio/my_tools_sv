[project]
name = "my-tools-sv"
version = "1.1.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joel", email = "joel@we-dev.io" }
]
requires-python = ">=3.13"
dependencies = [
    "aerich>=0.10.1",
    "fastapi[standard]>=0.162.0",
    "redis>=8.1.0",
    "taskiq[reload]>=0.13.0",
    "taskiq-aio-pika>=0.6.1",
    "tortoise-orm[asyncpg]>=1.1.9",
    "uvicorn[standard]>=0.54.0",
    "httpx2>=2.16.0",
    "dnspython>=2.9.0",
]

[project.scripts]
my-tools-sv = "my_tools_sv:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
